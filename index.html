const state={view:'esplora',query:'',genre:'Tutti',source:'Tutti',status:'Tutti',language:'Tutti',sort:'fit',reco:'demon',onlyFav:false};
let saved={};try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){}
if(!saved.progress)saved.progress={};if(!saved.custom)saved.custom=[];
const BOOKS=()=>[...SEED,...saved.custom];
const book=id=>BOOKS().find(x=>x.id===id);
const showTitle=b=>(b.source==='TikTok'&&b.id!=='boudica')||b.source==='Saga'?(b.aka||b.title):b.title;
const LANGUAGE_LABELS={it:'ITA',en:'ENG',soon:'IN ARRIVO',verify:'DA VERIFICARE'};
const LANGUAGE_EXPLAIN={
 it:'Edizione in italiano pubblicata; non implica che esista anche su Kindle.',
 en:'Non risulta una traduzione italiana pubblicata alla verifica del 14/11/2026; non è una garanzia che non esista o non uscirà.',
 soon:'Edizione italiana annunciata ma non ancora pubblicata.',
 verify:'Non abbiamo ancora informazioni sufficienti per confermare o escludere un’edizione italiana.'
};
function translationOf(b){
  const m=(window.READING_ROOM_TRANSLATIONS||{})[b.id]||{};
  if(b.translationStatus&&['it','en','soon','verify'].includes(b.translationStatus)){
    return {status:b.translationStatus,title:b.italianTitle||'',note:b.translationNote||''};
  }
  return {status:['it','en','soon','verify'].includes(m.status)?m.status:'verify',title:m.title||'',note:m.note||'',source:m.source||''};
}
function langTag(b){const m=translationOf(b),label=LANGUAGE_LABELS[m.status];return `<span class="tag lang-${m.status}" title="${esc(LANGUAGE_EXPLAIN[m.status])}">${label}</span>`}
function editionDetail(b){
 const m=translationOf(b),title=(m.title&&m.title!==b.title)?`<p><strong>Titolo italiano:</strong> ${esc(m.title)}</p>`:'';
 const note=m.note?`<p>${esc(m.note)}</p>`:'';
 const source=m.source&&/^https:\/\//.test(m.source)?`<a href="${esc(m.source)}" target="_blank" rel="noopener noreferrer">Verifica la scheda dell'edizione</a>`:'';
 return `<div class="edition-detail"><div class="edition-head"><strong>TRADUZIONE ITALIANA</strong>${langTag(b)}</div><p>${esc(LANGUAGE_EXPLAIN[m.status])}</p>${title}${note}${source}</div>`;
}
const progress=id=>saved.progress[id]||{};
const bookStatus=b=>progress(b.id).status||b.status||'Da leggere';
const isFav=id=>!!progress(id).fav;
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(saved))}catch(e){toast('Impossibile salvare: spazio o permessi del browser esauriti')}}
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
// L'account e' opzionale finche' Supabase non e' configurato.
const cloudSync=window.createReadingRoomSync({
  baseKey:KEY,
  getState:()=>saved,
  setState:next=>{saved={...next,progress:next.progress||{},custom:next.custom||[]};persist()},
  setStorage:key=>{storageKey=key},
  onData:()=>render(),
  onStatus:()=>{const el=document.getElementById('cloud-account-button');if(el&&cloudSync.ready){el.style.display='inline-flex';el.textContent=cloudSync.user?'☁ '+(cloudSync.status==='ready'?'Connesso':cloudSync.status==='error'?'Errore':'Sync'):'☁ Accedi'}},
  notify:message=>toast(message)
});
function cloudInfo(){
  if(!cloudSync.ready)return `<div class="notice"><strong>Dati locali:</strong> le tue note, gli stati e i preferiti restano su questo browser. Esporta un backup per conservarli.</div>`;
  const s=cloudSync.status,logged=!!cloudSync.user;
  const msg=logged?(s==='ready'?`☁ Sincronizzato${cloudSync.lastSync?' alle '+cloudSync.lastSync:''}`:s==='error'?'⚠ Il cloud non risponde; le modifiche restano al sicuro sul dispositivo.':s==='pending'?'⟳ Modifiche da sincronizzare':'⟳ Sincronizzazione in corso'):'Non hai effettuato l’accesso: le modifiche restano in questo browser.';
  return `<div class="notice"><strong>${logged?'Libreria personale cloud':'Sincronizza la tua libreria'}</strong><p>${esc(msg)}</p><div class="library-controls"><button class="small-btn" onclick="openCloudAccount()">${logged?'Gestisci account':'☁ Accedi con email'}</button>${logged?`<button class="small-btn" onclick="cloudSync.sync()">↻ Sincronizza ora</button>`:''}</div></div>`;
}
function openCloudAccount(){
  if(!cloudSync.ready)return;
  const logged=!!cloudSync.user;
  const content=logged?`<p>Account: <strong>${esc(cloudSync.user.email||'')}</strong></p><p class="muted">Le modifiche vengono salvate localmente e sincronizzate nel cloud quando possibile. Puoi sempre esportare un backup JSON.</p><div class="library-controls"><button class="primary-btn" onclick="cloudSync.sync();closeModal()">↻ Sincronizza ora</button><button class="small-btn" onclick="cloudSync.importGuest().then(()=>closeModal()).catch(e=>alert(e.message))">Importa dati locali precedenti</button><button class="small-btn" onclick="cloudSync.signOut().then(()=>closeModal()).catch(e=>alert(e.message))">Esci dall’account</button></div>`:`<p class="muted">Accedi con un link inviato alla tua email. Usa lo stesso indirizzo su iPhone, Windows e Mac per ritrovare preferiti, stati, note e libri personali.</p><form id="cloud-form" class="form-grid"><label class="all">Email<input name="email" type="email" required autocomplete="email" placeholder="nome@email.it"></label><div class="all"><button type="submit" class="primary-btn">Invia link di accesso</button></div></form>`;
  document.getElementById('dialog-root').innerHTML=`<div class="modal-overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="cloud-title"><button class="modal-close" onclick="closeModal()" aria-label="Chiudi">×</button><div style="padding:28px"><span class="eyebrow">LA TUA LIBRERIA OVUNQUE</span><h2 class="serif" id="cloud-title">☁ Sincronizzazione personale</h2>${content}</div></div></div>`;
  document.body.style.overflow='hidden';
  const form=document.getElementById('cloud-form');
  if(form)form.addEventListener('submit',async e=>{e.preventDefault();const btn=form.querySelector('button');btn.disabled=true;try{await cloudSync.signIn(form.elements.email.value);closeModal()}catch(err){alert('Accesso non riuscito: '+err.message)}finally{btn.disabled=false}});
}
function cssCover(b){const p=THEMES[b.genre]||['#527068','#20332d'];return `linear-gradient(154deg,${p[0]},${p[1]})`}
function cover(b,extra=''){return `<div class="cover ${extra}" style="--cover:${cssCover(b)}"><span class="cover-small">THE READING ROOM · ${esc(b.genre)}</span><span class="symbol" aria-hidden="true">${b.genre==='Fantasy'?'✦':b.genre==='Horror'?'✳':b.genre==='Memoir'?'◌':b.genre==='Storico'?'✣':'○'}</span><span class="cover-title">${esc(showTitle(b))}</span><span class="cover-author">${esc(b.author)}</span></div>`}
function card(b){return `<article class="book-card" role="button" tabindex="0" data-open="${esc(b.id)}" aria-label="Apri ${esc(b.title)}">
 ${cover(b)}<button class="heart ${isFav(b.id)?'on':''}" aria-label="${isFav(b.id)?'Rimuovi dai preferiti':'Aggiungi ai preferiti'}" data-fav="${esc(b.id)}" title="Preferito">${isFav(b.id)?'♥':'♡'}</button>
 <div class="card-head"><div><h3>${esc(showTitle(b))}</h3><p class="byline">${esc(b.author)} · ${b.year||'—'}</p></div></div>
 <div class="card-foot"><span class="tag">${esc(b.genre)}</span><span class="tag ${bookStatus(b)==='Letto'?'green':b.source==='TikTok'?'gold':''}">${esc(bookStatus(b))}</span>${langTag(b)}${b.flag?'<span class="tag faded">Da verificare</span>':''}</div>
 </article>`}
function mini(id){const b=book(id);if(!b)return '';return `<button class="reco-mini" data-open="${esc(id)}"><span class="swatch" style="--cover:${cssCover(b)}"></span><span><strong>${esc(showTitle(b))}</strong><small>${esc(b.author)}</small></span></button>`}
function nword(n,sing,plur){return `${n} ${n===1?sing:plur}`}
function stats(){let a=BOOKS();return `<div class="hero-numbers"><div class="num"><strong>${a.length}</strong><span>libri in archivio</span></div><div class="num"><strong>${a.filter(x=>bookStatus(x)==='Letto').length}</strong><span>letti segnati</span></div><div class="num"><strong>${new Set(a.map(x=>x.genre)).size}</strong><span>generi da esplorare</span></div></div>`}
function hero(){return `<section class="hero"><div class="shell hero-layout"><div><div class="eyebrow">IL TUO UNIVERSO DI STORIE · EDIZIONE 01</div><h1 class="serif">I libri che cerchi.<br><em>Le storie che ti trovano.</em></h1><p>Dalle biografie più sincere al fantasy più oscuro. Un posto per ritrovare ogni consiglio, capire cosa leggere e scoprire connessioni tra le storie.</p><div class="hero-actions"><button class="primary-btn" data-scroll="catalog">Esplora i libri ↘</button><button class="small-btn" onclick="go('percorsi')">Se ti è piaciuto… ↗</button></div>${stats()}</div><div class="hero-books" aria-hidden="true">${cover(book('demon'),'mini-cover')}${cover(book('the-road'),'mini-cover')}${cover(book('blade-itself'),'mini-cover')}</div></div></section>`}
function genrePills(){let genres=['Tutti',...new Set(BOOKS().map(x=>x.genre))];return `<div class="filters">${genres.map(g=>`<button class="pill ${state.genre===g?'active':''}" data-genre="${esc(g)}">${esc(g)}</button>`).join('')}</div>`}
function queryBooks(){let q=state.query.trim().toLocaleLowerCase('it');let a=BOOKS().filter(b=>{
let t=translationOf(b);let text=[b.title,b.aka,t.title,b.author,b.description,b.genre,b.series,b.why,(b.tags||[]).join(' ')].join(' ').toLocaleLowerCase('it');return (!q||text.includes(q))&&(state.genre==='Tutti'||b.genre===state.genre)&&(state.source==='Tutti'||b.source===state.source)&&(state.status==='Tutti'||bookStatus(b)===state.status)&&(state.language==='Tutti'||t.status===state.language)&&(!state.onlyFav||isFav(b.id));});
let sort=state.sort;if(sort==='title')a.sort((x,y)=>(x.aka||x.title).localeCompare(y.aka||y.title,'it'));else if(sort==='author')a.sort((x,y)=>x.author.localeCompare(y.author,'it'));else if(sort==='year')a.sort((x,y)=>(y.year||0)-(x.year||0));else a.sort((x,y)=>(y.fit||0)-(x.fit||0)||(x.title.localeCompare(y.title)));
return a;}
function catalog(){let a=queryBooks();return `<section id="catalog" class="shell section"><div class="section-title"><div><span class="eyebrow">UN CATALOGO CHE CRESCE CON TE</span><h2 class="serif">Tutti i libri, in un unico posto.</h2></div><p>Le valutazioni di affinità non sono classifiche oggettive. Il filtro ITA segnala una traduzione pubblicata, non necessariamente un'edizione Kindle; ENG indica che non ne abbiamo trovata una.</p></div><div class="toolrow"><label class="searchbar"><span aria-hidden="true">⌕</span><input id="search" placeholder="Cerca un titolo, autore, trama, atmosfera…" value="${esc(state.query)}" aria-label="Cerca nei libri"></label><select id="source" aria-label="Filtra per origine"><option value="Tutti">Tutte le origini</option>${['TikTok','Già discusso','Consigliato','Saga','NYT Thriller 2026','TBR · immagini 2026','Segnalato da te','Aggiunto da me'].map(s=>`<option ${state.source===s?'selected':''} value="${s}">${s}</option>`).join('')}</select><select id="language" aria-label="Filtra per traduzione italiana"><option value="Tutti">Tutte le lingue</option><option value="it" ${state.language==='it'?'selected':''}>ITA · Tradotti</option><option value="en" ${state.language==='en'?'selected':''}>ENG · Non trovati in italiano</option><option value="soon" ${state.language==='soon'?'selected':''}>In arrivo</option><option value="verify" ${state.language==='verify'?'selected':''}>Da verificare</option></select><select id="sort" aria-label="Ordina catalogo"><option value="fit" ${state.sort==='fit'?'selected':''}>Affinità per me</option><option value="title" ${state.sort==='title'?'selected':''}>Titolo A–Z</option><option value="author" ${state.sort==='author'?'selected':''}>Autore A–Z</option><option value="year" ${state.sort==='year'?'selected':''}>Più recenti</option></select></div>${genrePills()}<div class="countline"><span id="result-count">${nword(a.length,'libro trovato','libri trovati')}</span><button class="small-btn" onclick="resetFilters()">Azzera filtri</button></div><div id="books" class="book-grid">${a.length?a.map(card).join(''):'<div class="empty" style="grid-column:1/-1">Nessun libro trovato. Prova un altro filtro o una parola diversa.</div>'}</div></section>`}
function smartReco(seed){let b=book(seed);if(!b)return[];let explicit=(b.links||[]).map(book).filter(Boolean);let rest=BOOKS().filter(x=>x.id!==seed&&!explicit.some(e=>e.id===x.id)).map(x=>({b:x,s:(x.tags||[]).filter(t=>(b.tags||[]).includes(t)).length*2+(x.genre===b.genre?2:0)+(x.fit||0)/20})).sort((x,y)=>y.s-x.s).map(x=>x.b);return [...explicit,...rest].filter(x=>x.id!==seed).slice(0,4)}
function reco(){let b=book(state.reco)||book('demon');let a=smartReco(b.id);return `<div class="reco-feature"><div><div class="eyebrow">BIBLIOTECARIO PERSONALE</div><h3>«Se ti è piaciuto <em>${esc(showTitle(b))}</em>…»</h3><p>…potresti leggere questi. Una selezione ragionata per temi, atmosfera e personaggi; non una promessa di somiglianza perfetta.</p><label class="muted" for="reco-select" style="font-size:11px">PARTI DA UN LIBRO</label><select id="reco-select">${BOOKS().slice().sort((x,y)=>x.title.localeCompare(y.title)).map(x=>`<option value="${x.id}" ${x.id===b.id?'selected':''}>${esc(showTitle(x))}</option>`).join('')}</select></div><div id="reco-results" class="reco-results">${a.map(x=>mini(x.id)).join('')}</div></div>`}
function quickSection(){return `<section class="shell section" style="padding-bottom:15px"><div class="section-title"><div><span class="eyebrow">LEGGERE È TROVARE COLLEGAMENTI</span><h2 class="serif">Un libro conduce sempre a un altro.</h2></div><button class="small-btn" onclick="go('percorsi')">Vedi tutti i percorsi ↗</button></div>${reco()}</section>`}
function paths(){return `<section class="shell section"><div class="section-title"><div><span class="eyebrow">MAPPE DI LETTURA</span><h2 class="serif">Se ti è piaciuto X, prova Y.</h2></div><p>Otto percorsi costruiti attorno ai libri che abbiamo già discusso e alle cose che ti colpiscono: personaggi, emozioni, storia e storie vere.</p></div>${reco()}<div class="line"></div><div class="path-grid">${PATHS.map(p=>`<div class="path-card"><span class="eyebrow">${esc(p.icon)} · DA QUESTO LIBRO</span><h3>${esc(showTitle(book(p.id)))}</h3><p>${esc(p.detail)}</p><div class="path-list">${p.books.map((id,i)=>{const b=book(id);return `<button data-open="${id}"><span>${String(i+1).padStart(2,'0')}</span>${esc(showTitle(b))}</button>`}).join('')}</div></div>`).join('')}</div></section>`}
function saghe(){return `<section class="shell section"><div class="section-title"><div><span class="eyebrow">L'ORDINE CONTA</span><h2 class="serif">Saghe, senza partire dal terzo volume.</h2></div><p>Ogni saga è ordinata per volume; sono mostrati soltanto i libri presenti nel nostro catalogo.</p></div><div class="notice">Nota: per alcune saghe sono presenti solo alcuni volumi. Per Red Rising e Dungeon Crawler Carl trovi invece tutti i titoli mostrati nelle quattro immagini, nell'ordine corretto.</div><div class="series-list">${SERIES.map(s=>`<article class="series-box"><div class="eyebrow">SCAFFALE · ${s.ids.length} ${s.ids.length===1?'TITOLO':'TITOLI'}</div><h3>${esc(s.name)}</h3><small>${esc(s.subtitle)}</small><div class="series-chapters">${s.ids.map(id=>{let b=book(id);return `<button data-open="${id}"><strong>${b.volume?'VOL. '+b.volume+' · ':''}${esc(showTitle(b))}</strong><small>${esc(b.author)} · ${esc(bookStatus(b))} · ${langTag(b)}</small></button>`}).join('')}</div></article>`).join('')}</div></section>`}
function myLibrary(){let a=BOOKS(),counts=Object.fromEntries(STATUS.map(s=>[s,a.filter(b=>bookStatus(b)===s).length]));return `<section class="shell section"><div class="section-title"><div><span class="eyebrow">UN ARCHIVIO TUTTO TUO</span><h2 class="serif">La mia libreria.</h2></div><p>Qui puoi segnare letti, libri in corso, preferiti e note. Con un account puoi sincronizzare stati, note e preferiti sui tuoi dispositivi.</p></div><div class="library-overview">${STATUS.map(s=>`<div><strong>${counts[s]}</strong><span>${s}</span></div>`).join('')}</div>${cloudInfo()}<div class="library-controls"><button class="primary-btn" onclick="openAdd()">+ Aggiungi libro</button><button class="small-btn" onclick="exportData()">↓ Esporta backup JSON</button><button class="small-btn" onclick="document.getElementById('import-file').click()">↑ Importa backup JSON</button><input id="import-file" aria-label="Importa un backup" type="file" accept="application/json,.json" style="display:none" onchange="importData(this)"></div><div class="section-title"><div><span class="eyebrow">RITROVALI SUBITO</span><h2 class="serif">I tuoi preferiti</h2></div></div><div class="book-grid">${a.filter(x=>isFav(x.id)).map(card).join('')||'<div class="empty" style="grid-column:1/-1">Non hai ancora aggiunto preferiti. Apri un libro e premi il cuore ♡.</div>'}</div><div class="line"></div><div class="section-title"><div><span class="eyebrow">UN'ABITUDINE ALLA VOLTA</span><h2 class="serif">Le letture già segnate come finite</h2></div></div><div class="book-grid">${a.filter(x=>bookStatus(x)==='Letto').map(card).join('')||'<div class="empty" style="grid-column:1/-1">Ancora nessuna lettura terminata.</div>'}</div></section>`}

function setBookStatus(id,v){if(!STATUS.includes(v))return;saved.progress[id]={...progress(id),status:v};persist();cloudSync.queueProgress(id);render();openBook(id);toast('Stato aggiornato')}
function setNote(id,v){saved.progress[id]={...progress(id),note:v};persist();cloudSync.queueProgress(id);toast(cloudSync.user?'Nota salvata; sincronizzazione in corso':'Nota salvata sul dispositivo')}
function openBook(id){let b=book(id);if(!b)return;let st=bookStatus(b);let notes=progress(id).note||'';let s=book(b.id);let rec=smartReco(id).filter(x=>x.id!==id).slice(0,3);let html=`<div class="modal-overlay" data-backdrop="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="book-dialog-title"><button class="modal-close" onclick="closeModal()" aria-label="Chiudi">×</button><div class="modal-layout"><div><div style="max-width:230px">${cover(b)}</div><label class="muted" style="font-size:11px;display:block;margin-top:15px" for="status-picker">STATO DI LETTURA</label><select class="status-select" id="status-picker" onchange="setBookStatus('${esc(id)}',this.value)">${STATUS.map(x=>`<option ${st===x?'selected':''}>${x}</option>`).join('')}</select><button class="small-btn" style="width:100%" onclick="toggleFav('${esc(id)}');openBook('${esc(id)}')">${isFav(id)?'♥ Rimuovi preferito':'♡ Aggiungi preferito'}</button>${b.fit?`<p class="muted" style="font-size:11px">Affinità stimata: <strong>${String(b.fit).replace('.',',')}/10</strong></p>`:''}</div><div class="modal-detail"><div class="eyebrow">${esc(b.source)} · ${b.year||'SENZA ANNO'}</div><h2 id="book-dialog-title">${esc(showTitle(b))}</h2><p class="subtitle">${esc(b.author)}${b.aka?' · '+esc(b.source==='TikTok'?b.title:b.aka):''}</p><div class="modal-meta"><span class="tag gold">${esc(b.genre)}</span>${b.series?`<span class="tag">${esc(b.series)}${b.volume?' · vol. '+b.volume:''}</span>`:''}${b.flag?'<span class="tag faded">Titolo da confermare</span>':''}</div>${editionDetail(b)}<span class="eyebrow">DI COSA PARLA · SENZA SPOILER</span><p>${esc(b.description)}</p><span class="eyebrow">PERCHÉ POTREBBE PIACERTI</span><p>${esc(b.why)}</p>${b.flag?`<div class="notice">⚑ ${esc(b.flag)}</div>`:''}<div style="margin-top:18px"><label class="eyebrow" for="note">LA TUA NOTA PERSONALE</label><textarea class="modal-notes" id="note" placeholder="Cosa ti incuriosisce? Cosa ti è rimasto dopo averlo letto?" onblur="setNote('${esc(id)}',this.value)">${esc(notes)}</textarea><small class="muted" style="font-size:10px">${cloudSync.user?'La nota sarà sincronizzata con il tuo account.':'La nota resta su questo browser finché non accedi.'}</small></div><div class="modal-reco"><div class="eyebrow">DA QUESTO LIBRO A UN ALTRO</div>${rec.map(x=>mini(x.id)).join('')}</div></div></div></div></div>`;
let root=document.getElementById('dialog-root');root.innerHTML=html;document.body.style.overflow='hidden';let overlay=root.querySelector('.modal-overlay');overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});root.querySelector('.modal-close').focus();}
function closeModal(){document.getElementById('dialog-root').innerHTML='';document.body.style.overflow=''}
function randomBook(){let a=BOOKS().filter(x=>bookStatus(x)!=='Letto');if(!a.length)a=BOOKS();openBook(a[Math.floor(Math.random()*a.length)].id)}
function openAdd(){let html=`<div class="modal-overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="add-title"><button class="modal-close" onclick="closeModal()" aria-label="Chiudi">×</button><div style="padding:28px"><span class="eyebrow">IL TUO ARCHIVIO CRESCE</span><h2 id="add-title" class="serif" style="font-weight:400">Aggiungi un libro</h2><p class="muted" style="font-size:12px">Il libro sarà salvato nel tuo archivio personale e, se hai effettuato l’accesso, sincronizzato sui tuoi dispositivi.</p><form id="add-form" class="form-grid"><label>Titolo *<input name="title" required maxlength="120"></label><label>Autore *<input name="author" required maxlength="120"></label><label>Genere<select name="genre">${Object.keys(THEMES).map(g=>`<option>${g}</option>`).join('')}</select></label><label>Anno<input name="year" type="number" min="1000" max="2100"></label><label>Traduzione italiana<select name="translationStatus"><option value="verify">Da verificare</option><option value="it">ITA · Esiste</option><option value="en">ENG · Non trovata</option><option value="soon">In arrivo</option></select></label><label>Titolo italiano (facoltativo)<input name="italianTitle" maxlength="150"></label><label class="all">Trama breve<textarea name="description" maxlength="800" placeholder="Di cosa parla, senza spoiler?"></textarea></label><label class="all">Perché mi interessa<textarea name="why" maxlength="450" placeholder="Una nota su questo libro"></textarea></label><div class="all"><button type="submit" class="primary-btn">Salva il libro</button></div></form></div></div></div>`;document.getElementById('dialog-root').innerHTML=html;document.body.style.overflow='hidden';document.getElementById('add-form').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.currentTarget);let id='custom-'+Date.now();saved.custom.push({id,title:String(f.get('title')).trim(),author:String(f.get('author')).trim(),genre:String(f.get('genre')),year:Number(f.get('year'))||null,translationStatus:String(f.get('translationStatus')||'verify'),italianTitle:String(f.get('italianTitle')||'').trim(),description:String(f.get('description')).trim()||'Trama ancora da scrivere.',why:String(f.get('why')).trim()||'Aggiunto alla mia libreria.',source:'Aggiunto da me',tags:[],links:[]});persist();cloudSync.queueCustom(id);closeModal();render();toast('Libro aggiunto al catalogo personale');});document.querySelector('.modal-overlay').addEventListener('click',e=>{if(e.target.classList.contains('modal-overlay'))closeModal()});}
function exportData(){let content=JSON.stringify({app:'The Reading Room',version:1,exported:new Date().toISOString(),progress:saved.progress,custom:saved.custom},null,2);let blob=new Blob([content],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='the-reading-room-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('Backup esportato')}
async function importData(el){let file=el.files?.[0];if(!file)return;try{let d=JSON.parse(await file.text());if(d.app!=='The Reading Room'||d.version!==1||!d.progress||!Array.isArray(d.custom))throw Error('Formato non valido');if(!confirm('Importare il backup? Sostituirà note, stati e libri personali su questo dispositivo.'))return;const allowed=Object.fromEntries(BOOKS().map(x=>[x.id,true]));saved.progress=Object.fromEntries(Object.entries(d.progress).filter(([id,val])=>typeof val==='object'&&val!==null));saved.custom=d.custom.filter(x=>x&&typeof x.id==='string'&&(/^custom-[0-9]+$/).test(x.id)&&typeof x.title==='string'&&typeof x.author==='string'&&typeof x.description==='string').slice(0,1000);persist();cloudSync.queueAll();render();toast('Backup importato; sincronizzazione avviata se hai un account')}catch(e){alert('Impossibile leggere il backup: '+e.message)}finally{el.value=''}}
let toastTimer;function toast(s){let root=document.getElementById('toast-root');root.innerHTML=`<div class="toast">${esc(s)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',2700)}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-nav]');if(nav){go(nav.dataset.nav);return}let fav=e.target.closest('[data-fav]');if(fav){e.stopPropagation();toggleFav(fav.dataset.fav);return}let item=e.target.closest('[data-open]');if(item){openBook(item.dataset.open);return}let genre=e.target.closest('[data-genre]');if(genre){state.genre=genre.dataset.genre;render();document.getElementById('catalog')?.scrollIntoView({block:'start'});return}let scroll=e.target.closest('[data-scroll]');if(scroll){document.getElementById(scroll.dataset.scroll)?.scrollIntoView({behavior:'smooth'});return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('article.book-card')){e.preventDefault();openBook(e.target.dataset.open)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;drawFiltered()}});
document.addEventListener('change',e=>{if(e.target.id==='sort'){state.sort=e.target.value;drawFiltered()}if(e.target.id==='source'){state.source=e.target.value;drawFiltered()}if(e.target.id==='language'){state.language=e.target.value;drawFiltered()}if(e.target.id==='reco-select'){state.reco=e.target.value;let current=book(state.reco);let parent=e.target.closest('.reco-feature');if(parent){parent.outerHTML=reco()}}});
render();
cloudSync.init();
</script>
</body></html>
